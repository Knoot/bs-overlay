<div
  id="playing-overlay"
  class="view-mode"
  [class.active]="ui().playingActive"
  [style.flex-direction]="ui().playingFlexDirection"
  [style.top]="ui().playingTop"
  [style.bottom]="ui().playingBottom"
  [style.align-items]="ui().playingAlignItems"
>
  <div
    class="glass-panel"
    id="top-glass-panel"
    [class.panel-no-bg]="ui().topPanelNoBackground"
    [style.display]="ui().topPanelDisplay"
  >
    <div
      id="header-row"
      [style.display]="ui().headerDisplay"
      [style.flex-direction]="ui().headerFlexDirection"
    >
      <app-song-cover></app-song-cover>
      <div
        id="text-block"
        [style.display]="ui().textBlockDisplay"
        [style.align-items]="ui().textBlockAlignItems"
        [style.text-align]="ui().textBlockTextAlign"
      >
        <app-song-identity></app-song-identity>
        <app-song-meta></app-song-meta>
        <app-map-ratings></app-map-ratings>
        <app-pp-predictor></app-pp-predictor>
      </div>
    </div>
    <app-progress-bar></app-progress-bar>
  </div>

  <app-hp-bar></app-hp-bar>

  <app-bottom-stats></app-bottom-stats>
</div>
